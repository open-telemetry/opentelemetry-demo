apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/srclos-net/opentelemetry-demo.git
    targetRevision: main
    path: deploy
    # allow referencing ../kubernetes (the kustomize load-restrictor default
    # blocks parent-directory resources)
    kustomize:
      buildOptions: --load-restrictor LoadRestrictionsNone
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
