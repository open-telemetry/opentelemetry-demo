apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/srclos-net/opentelemetry-demo.git
    targetRevision: main
    # kustomization.yaml lives at the repo root; the collector overlay patch
    # lives under deploy/ (hand-apply deploy/argocd.yaml once, as with the
    # bank/obi/train/via-trains Applications).
    path: .
 