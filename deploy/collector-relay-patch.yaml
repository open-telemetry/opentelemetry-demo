# Replaces the demo otel-collector ConfigMap (data key "relay") so the demo is a
# pure telemetry relay — one-way merge into the estate (ObserveNow / stephgen-medussa):
#
#   traces + metrics + logs -> otlphttp/estate = data-recipes-traces-relay.data-recipes:4318
#     (the fan-out point the faro-collector already uses; on fe-stackgen-run, the relay
#      exports traces -> medussa traces-collector, metrics -> medussa PRW and
#      logs -> medussa Loki with service_name label promotion; it holds the estate
#      basic-auth credential, so the demo never needs one)
#
# Differences vs the earlier relay patch:
#   - logs now actually reach Loki (otel-collector.devopsnow:4318 silently DROPPED logs)
#   - jaeger / prometheus / opensearch exporters are gone: the in-namespace backends
#     are stripped from the deployment entirely (deploy/strip-backends.yaml)
#   - spanmetrics keeps dims for method/path so estate APM dashboards can group per API
# kafka / valkey / postgresql receivers stay — those are the demo's app data stores,
# the source of its failure modes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: otel-demo
data:
  relay: |
    connectors:
      spanmetrics:
        dimensions:
          - name: http.request.method
          - name: url.path
        dimensions_cache_size: 1000
    exporters:
      otlphttp/estate:
        endpoint: http://data-recipes-traces-relay.data-recipes.svc.cluster.local:4318
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      batch: {}
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.node.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
          - action: insert
            from_attribute: k8s.pod.uid
            key: service.instance.id
      resourcedetection:
        detectors:
          - env
          - system
      transform:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - replace_pattern(name, "\\?.*", "")
              - replace_match(name, "GET /api/products/*", "GET /api/products/{productId}")
    receivers:
      httpcheck/frontend-proxy:
        targets:
          - endpoint: http://frontend-proxy:8080
      jaeger:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:14250
          thrift_compact:
            endpoint: ${env:MY_POD_IP}:6831
          thrift_http:
            endpoint: ${env:MY_POD_IP}:14268
      nginx:
        collection_interval: 10s
        endpoint: http://image-provider:8081/status
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            cors:
              allowed_origins:
                - http://*
                - https://*
            endpoint: ${env:MY_POD_IP}:4318
      postgresql:
        endpoint: postgresql:5432
        metrics:
          postgresql.blks_hit:
            enabled: true
          postgresql.blks_read:
            enabled: true
          postgresql.deadlocks:
            enabled: true
          postgresql.tup_deleted:
            enabled: true
          postgresql.tup_fetched:
            enabled: true
          postgresql.tup_inserted:
            enabled: true
          postgresql.tup_returned:
            enabled: true
          postgresql.tup_updated:
            enabled: true
        password: otel
        tls:
          insecure: true
        username: root
      redis:
        collection_interval: 10s
        endpoint: valkey-cart:6379
        username: valkey
      zipkin:
        endpoint: ${env:MY_POD_IP}:9411
    service:
      extensions:
        - health_check
      pipelines:
        logs:
          exporters:
            - otlphttp/estate
          processors:
            - k8sattributes
            - memory_limiter
            - resourcedetection
            - resource
            - batch
          receivers:
            - otlp
        metrics:
          exporters:
            - otlphttp/estate
          processors:
            - k8sattributes
            - memory_limiter
            - resourcedetection
            - resource
            - batch
          receivers:
            - httpcheck/frontend-proxy
            - nginx
            - otlp
            - postgresql
            - redis
            - spanmetrics
        traces:
          exporters:
            - otlphttp/estate
            - spanmetrics
          processors:
            - k8sattributes
            - memory_limiter
            - resourcedetection
            - resource
            - transform
            - batch
          receivers:
            - otlp
            - jaeger
            - zipkin
