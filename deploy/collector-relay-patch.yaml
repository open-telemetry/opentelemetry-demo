apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: otel-demo
data:
  relay: "connectors:\n  spanmetrics: {}\nexporters:\n  debug: {}\n  opensearch:\n\
    \    http:\n      endpoint: http://opensearch:9200\n      tls:\n        insecure:\
    \ true\n    logs_index: otel-logs\n    logs_index_time_format: yyyy-MM-dd\n  otlp:\n\
    \    endpoint: jaeger-collector:4317\n    tls:\n      insecure: true\n  otlphttp/prometheus:\n\
    \    endpoint: http://prometheus:9090/api/v1/otlp\n    tls:\n      insecure: true\n\
    \  otlphttp/stephgen:\n    endpoint: http://otel-collector.devopsnow:4318\nextensions:\n\
    \  health_check:\n    endpoint: ${env:MY_POD_IP}:13133\nprocessors:\n  batch:\
    \ {}\n  k8sattributes:\n    extract:\n      metadata:\n      - k8s.namespace.name\n\
    \      - k8s.deployment.name\n      - k8s.statefulset.name\n      - k8s.daemonset.name\n\
    \      - k8s.cronjob.name\n      - k8s.job.name\n      - k8s.node.name\n     \
    \ - k8s.pod.name\n      - k8s.pod.uid\n      - k8s.pod.start_time\n    passthrough:\
    \ false\n    pod_association:\n    - sources:\n      - from: resource_attribute\n\
    \        name: k8s.pod.ip\n    - sources:\n      - from: resource_attribute\n\
    \        name: k8s.pod.uid\n    - sources:\n      - from: connection\n  memory_limiter:\n\
    \    check_interval: 5s\n    limit_percentage: 80\n    spike_limit_percentage:\
    \ 25\n  resource:\n    attributes:\n    - action: insert\n      from_attribute:\
    \ k8s.pod.uid\n      key: service.instance.id\n  resourcedetection:\n    detectors:\n\
    \    - env\n    - system\n  transform:\n    error_mode: ignore\n    trace_statements:\n\
    \    - context: span\n      statements:\n      - replace_pattern(name, \"\\\\\
    ?.*\", \"\")\n      - replace_match(name, \"GET /api/products/*\", \"GET /api/products/{productId}\"\
    )\nreceivers:\n  httpcheck/frontend-proxy:\n    targets:\n    - endpoint: http://frontend-proxy:8080\n\
    \  jaeger:\n    protocols:\n      grpc:\n        endpoint: ${env:MY_POD_IP}:14250\n\
    \      thrift_compact:\n        endpoint: ${env:MY_POD_IP}:6831\n      thrift_http:\n\
    \        endpoint: ${env:MY_POD_IP}:14268\n  nginx:\n    collection_interval:\
    \ 10s\n    endpoint: http://image-provider:8081/status\n  otlp:\n    protocols:\n\
    \      grpc:\n        endpoint: ${env:MY_POD_IP}:4317\n      http:\n        cors:\n\
    \          allowed_origins:\n          - http://*\n          - https://*\n   \
    \     endpoint: ${env:MY_POD_IP}:4318\n  postgresql:\n    endpoint: postgresql:5432\n\
    \    metrics:\n      postgresql.blks_hit:\n        enabled: true\n      postgresql.blks_read:\n\
    \        enabled: true\n      postgresql.deadlocks:\n        enabled: true\n \
    \     postgresql.tup_deleted:\n        enabled: true\n      postgresql.tup_fetched:\n\
    \        enabled: true\n      postgresql.tup_inserted:\n        enabled: true\n\
    \      postgresql.tup_returned:\n        enabled: true\n      postgresql.tup_updated:\n\
    \        enabled: true\n    password: otel\n    tls:\n      insecure: true\n \
    \   username: root\n  prometheus:\n    config:\n      scrape_configs:\n      -\
    \ job_name: opentelemetry-collector\n        scrape_interval: 10s\n        static_configs:\n\
    \        - targets:\n          - ${env:MY_POD_IP}:8888\n  redis:\n    collection_interval:\
    \ 10s\n    endpoint: valkey-cart:6379\n    username: valkey\n  zipkin:\n    endpoint:\
    \ ${env:MY_POD_IP}:9411\nservice:\n  extensions:\n  - health_check\n  pipelines:\n\
    \    logs:\n      exporters:\n      - opensearch\n      - debug\n      - otlphttp/stephgen\n\
    \      processors:\n      - k8sattributes\n      - memory_limiter\n      - resourcedetection\n\
    \      - resource\n      - batch\n      receivers:\n      - otlp\n    metrics:\n\
    \      exporters:\n      - otlphttp/prometheus\n      - debug\n      - otlphttp/stephgen\n\
    \      processors:\n      - k8sattributes\n      - memory_limiter\n      - resourcedetection\n\
    \      - resource\n      - batch\n      receivers:\n      - httpcheck/frontend-proxy\n\
    \      - nginx\n      - otlp\n      - postgresql\n      - redis\n      - spanmetrics\n\
    \    traces:\n      exporters:\n      - otlp\n      - debug\n      - spanmetrics\n\
    \      - otlphttp/stephgen\n      processors:\n      - k8sattributes\n      -\
    \ memory_limiter\n      - resourcedetection\n      - resource\n      - transform\n\
    \      - batch\n      receivers:\n      - otlp\n      - jaeger\n      - zipkin\n\
    \  telemetry:\n    metrics:\n      level: detailed\n      readers:\n      - periodic:\n\
    \          exporter:\n            otlp:\n              endpoint: otel-collector:4318\n\
    \              protocol: http/protobuf\n          interval: 10000\n          timeout:\
    \ 5000\n"
