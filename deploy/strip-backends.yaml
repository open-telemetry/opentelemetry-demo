# Removes the demo's own observability backends — the estate (ObserveNow on
# eks-prod-2) is the single store for traces, metrics and logs, so keeping
# in-namespace Jaeger/Prometheus/OpenSearch/Grafana would double the story and the
# resource bill for nothing. The demo's APP data stores (postgresql, valkey-cart,
# kafka) stay — they are where the demo's failure modes live.
#
# Kustomize "$patch: delete" removes each matched resource from the rendered output.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: otel-demo
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: otel-demo
$patch: delete
---
apiVersion: apps/v1
kind: Deployment
