apiVersion: 1

datasources:
  - name: Prometheus
    uid: webstore-metrics
    type: prometheus
    url: http://prometheus:9090
    editable: true
    isDefault: true
    jsonData:
      # Align Prometheus data source time interval with the OTel SDKs' export interval (see OTEL_METRIC_EXPORT_INTERVAL)
      timeInterval: "60s"
      exemplarTraceIdDestinations:
        - datasourceUid: webstore-traces
          name: trace_id

        - url: http://localhost:8080/jaeger/ui/trace/$${__value.raw}
          name: trace_id
          urlDisplayLabel: View in Jaeger UI

        # Links to the Demo Dashboard's Log Records panel instead of using `datasourceUid`,
        # since the OpenSearch datasource plugin doesn't yet support Grafana's trace-link
        # interface (grafana/opensearch-datasource#194). Sets $traceId and forces $service to
        # "All" since a trace can span multiple services.
        - url: http://localhost:8080/grafana/d/W2gX2zHVk/demo-dashboard?orgId=1&var-service=All&var-traceId=$${__value.raw}
          name: trace_id
          urlDisplayLabel: View in Logs (OpenSearch)
