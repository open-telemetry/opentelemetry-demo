runbooks:

  - id: RB-001
    description: "Payment charge errors — disable paymentFailure flag"
    applies_to:
      cause_categories:
        - service_fault_injected_errors
      component_hints:
        - payment
    action: set_feature_flag
    params:
      flag: paymentFailure
      variant: "off"
    risk: low
    reason_template: "Payment service is returning {value}% errors. Disabling the paymentFailure flag will immediately stop artificial charge failures."
    expected_recovery_signal: "payment error ratio drops below 2% within 2 minutes"
    rollback_action: rollback

  - id: RB-002
    description: "Payment unreachable — disable paymentUnreachable flag"
    applies_to:
      cause_categories:
        - service_fault_injected_errors
        - dependency_unavailable
      component_hints:
        - payment
    action: set_feature_flag
    params:
      flag: paymentUnreachable
      variant: "off"
    risk: low
    reason_template: "Payment service is unreachable. Disabling the paymentUnreachable flag should restore connectivity."
    expected_recovery_signal: "payment error ratio drops below 2%, checkout recovers"
    rollback_action: rollback

  - id: RB-003
    description: "Payment container down — restart payment service"
    applies_to:
      cause_categories:
        - container_down_or_crashloop
        - dependency_unavailable
      component_hints:
        - payment
    action: restart_service
    params:
      service: payment
    risk: low
    reason_template: "Payment container is {state}. Restarting should restore service."
    expected_recovery_signal: "payment container running and healthy, error ratio < 2%"
    rollback_action: null

