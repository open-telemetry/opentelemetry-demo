name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    permissions:
      contents: read  # for actions/checkout
      pull-requests: read  # for dorny/paths-filter to list changed files
    uses: open-telemetry/shared-workflows/.github/workflows/chloggen.yml@efc55838c9769c5476e0a5cf7183a8c5b4ae70a5  # v0.24.0
    with:
      go-version: '1.27.1'
      # Only maintainers and approvers can add labels, so a title marker would
      # let any author opt out.
      skip-title-marker: ''
