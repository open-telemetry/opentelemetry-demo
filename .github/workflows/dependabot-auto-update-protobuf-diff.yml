name: Dependency bot auto-update protobuf diff

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] restricted to Dependabot and Renovate PRs and pushes only generated protobuf updates
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  dependabot-auto-update-protobuf-diff:
    name: Update protobuf diff
    permissions:
      contents: write  # required to push generated protobuf updates
      pull-requests: write  # required to update dependency bot PR branches
    runs-on: ubuntu-latest
    # Only run this job if the PR is opened by Dependabot or Renovate
    if: contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.event.pull_request.user.login)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.DEPENDABOT_TOKEN }}
          persist-credentials: false
      - name: Generate
        run: make clean docker-generate-protobuf
      - name: Commit only if there are changes
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DEPENDABOT_TOKEN: ${{ secrets.DEPENDABOT_TOKEN }}
        run: |
          if ! git diff --quiet; then
            if [[ "$PR_AUTHOR" == "renovate[bot]" ]]; then
              BOT_USER_ID=29139614
            else
              BOT_USER_ID=49699333
            fi
            git config user.name "$PR_AUTHOR"
            git config user.email "${BOT_USER_ID}+${PR_AUTHOR}@users.noreply.github.com"
            git add .
            git commit -s -m "chore: update protobuf"
            AUTH_HEADER=$(printf 'x-access-token:%s' "${DEPENDABOT_TOKEN}" | base64 -w 0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" push origin "HEAD:${BRANCH_NAME}"
          fi
