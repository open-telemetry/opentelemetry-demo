# Fork image build: same Dockerfiles/contexts as upstream's component-build-images.yml,
# reduced to the services this fork ships (see deploy/fork-images.yaml), GHCR-only,
# amd64-only (the demo cluster is civo; the upstream workflow also builds arm64).
#
# Tags: ghcr.io/srclos-net/demo:2.1.3-faro.<n>-<service> and latest-<service>.
# Bump the version default together with deploy/fork-images.yaml when new images
# should roll out (Argo CD does not restart pods on same-tag image changes).
#
# GHCR note: the first build creates ghcr.io/srclos-net/demo packages as PRIVATE.
# Either flip the package visibility to public (package settings), or keep default
# pull behavior working via an imagePullSecret — public is the low-friction path.
name: Build fork demo images

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (prefix of -<service>)'
        default: '2.1.3-faro.1'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  protobufcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Generate
        run: make clean docker-generate-protobuf
      - name: Check Clean Work Tree
        run: make check-clean-work-tree

  build_and_push_images:
    runs-on: ubuntu-latest
    needs: protobufcheck
    strategy:
      fail-fast: false
      matrix:
        file_tag:
          - file: ./src/ad/Dockerfile
            tag_suffix: ad
          - file: ./src/cart/src/Dockerfile
            tag_suffix: cart
          - file: ./src/checkout/Dockerfile
            tag_suffix: checkout
          - file: ./src/frontend/Dockerfile
            tag_suffix: frontend
          - file: ./src/fraud-detection/Dockerfile
            tag_suffix: fraud-detection
          - file: ./src/payment/Dockerfile
            tag_suffix: payment
          - file: ./src/product-catalog/Dockerfile
            tag_suffix: product-catalog
          - file: ./src/recommendation/Dockerfile
            tag_suffix: recommendation
          - file: ./src/shipping/Dockerfile
            tag_suffix: shipping
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Load environment variables from .env file
        run: |
          grep -vE '^\s*#|^\s*$' .env | while read -r line; do
            echo "$line" >> $GITHUB_ENV
          done
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
            max-parallelism = 2
      - name: Build and push demo images
        uses: docker/build-push-action@v7.0.0
        with:
          context: ./
          file: ${{ matrix.file_tag.file }}
          platforms: linux/amd64
          push: true
          build-args: |
            OTEL_JAVA_AGENT_VERSION=${{ env.OTEL_JAVA_AGENT_VERSION }}
            OPENTELEMETRY_CPP_VERSION=${{ env.OPENTELEMETRY_CPP_VERSION }}
            TRACETEST_IMAGE_VERSION=${{ env.TRACETEST_IMAGE_VERSION }}
            OPENSEARCH_IMAGE=${{ env.OPENSEARCH_IMAGE }}
          tags: |
            ghcr.io/srclos-net/demo:${{ github.event.inputs.version || '2.1.3-faro.1' }}-${{ matrix.file_tag.tag_suffix }}
            ghcr.io/srclos-net/demo:latest-${{ matrix.file_tag.tag_suffix }}
          cache-from: type=gha
          cache-to: type=gha
