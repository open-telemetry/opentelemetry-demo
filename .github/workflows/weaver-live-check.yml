name: Weaver Live Check

on:
  workflow_call:

permissions:
  contents: read

env:
  WEAVER_VERSION: v0.26.1
  COMPOSE_FILE: compose.yaml:test/telemetry/compose-weaver-live-check.yaml:compose.extras.yaml

jobs:
  live-check:
    name: Weaver live-check smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune -af

      - name: Download demo images artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: demo-images-${{ github.run_id }}

      - name: Load demo images
        run: zstd -d -c demo-images.tar.zst | docker load

      - name: Setup Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@38befce4bc68fe320d20f189465c93835ac20c12  # v0.26.1
        with:
          version: ${{ env.WEAVER_VERSION }}

      - name: Start Weaver
        id: live-check
        uses: open-telemetry/weaver/.github/actions/weaver-live-check-start@38befce4bc68fe320d20f189465c93835ac20c12  # v0.26.1
        with:
          registry: telemetry-schema
          config: test/telemetry/weaver-live-check.toml
          inactivity-timeout: '300'

      - name: Start demo
        id: demo
        run: |
          # Run an isolated demo stack so Weaver receives the same processed
          # traces and metrics exported to backends without disrupting the
          # normal telemetry tests.
          touch .env.override
          echo "started=true" >> "$GITHUB_OUTPUT"
          docker compose \
            --env-file .env --env-file .env.override \
            up --force-recreate --remove-orphans --detach \
            --wait --wait-timeout 180 --scale load-generator=0

      - name: Drive checkout traffic
        run: |
          docker build -t opentelemetry-demo-telemetry-tests ./test/telemetry
          docker run --rm --network opentelemetry-demo \
            --env-file .env --env-file .env.override \
            -e WARMUP_PROBE_CHECKOUTS=2 \
            -e WARMUP_PROBE_TIMEOUT=120 \
            --entrypoint python \
            opentelemetry-demo-telemetry-tests \
            -c 'from conftest import _run_warmup_probe; _run_warmup_probe()'
          sleep 15

      - name: Flush telemetry
        if: always() && steps.demo.outputs.started == 'true'
        run: |
          docker compose \
            --env-file .env --env-file .env.override \
            stop --timeout 30 otel-collector

      - name: Stop Weaver and collect report
        id: live-check-report
        if: always() && steps.live-check.outcome == 'success'
        uses: open-telemetry/weaver/.github/actions/weaver-live-check-stop@38befce4bc68fe320d20f189465c93835ac20c12  # v0.26.1
        with:
          fail-on: none

      - name: Check observed telemetry coverage
        if: always() && steps.live-check-report.outputs.report-path != ''
        env:
          REPORT_PATH: ${{ steps.live-check-report.outputs.report-path }}
        run: |
          jq -e '
            (
              (.statistics.total_entities // 0) > 0
              and any(.samples[]?; .span != null)
              and (
                (.statistics.seen_registry_attributes // {})
                | any(.[]; . > 0)
              )
              and (
                (.statistics.seen_registry_metrics // {})
                | any(.[]; . > 0)
              )
            ) or error(
              "Weaver did not observe spans, registered attributes, and registered metrics"
            )
          ' "$REPORT_PATH" > /dev/null

      - name: Print service logs on failure
        if: failure() && steps.demo.outputs.started == 'true'
        run: |
          docker compose \
            --env-file .env --env-file .env.override \
            logs --tail=80

      - name: Stop demo
        if: always() && steps.demo.outputs.started == 'true'
        run: |
          docker compose \
            --env-file .env --env-file .env.override \
            down --remove-orphans --volumes
