file_format: definition/2
metrics:
  - name: demo.chatbot.requests
    brief: Chatbot request counter
    instrument: counter
    unit: "{request}"
    stability: stable
    requirement_level: recommended
    note: Counts chat messages sent from the chatbot UI to the agent service
    annotations:
      service: chatbot
