file_format: definition/2
attributes:
  - key: gen_ai.input.prompt
    type: string
    brief: The user prompt sent to a GenAI agent
    stability: stable
    note: The natural-language prompt text sent to the agent's `/prompt` endpoint
    examples: ["What products do you recommend for a home office?"]
